[package]
authors = []
description = "Neutron Jupiter AUM contract"
edition = "2021"
name = "jupiter-aum"
repository = "https://github.com/structured-org/aum-oracle.git"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { version = "2.2.2" }
cosmwasm-std = { version = "2.2.2" }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
schemars = "0.8.8"
serde = { version = "1.0.175", default-features = false, features = ["derive"] }
thiserror = { version = "1.0" }
hex = "0.4.3"
sha2 = "0.10.8"
neutron-std = { git = "https://github.com/neutron-org/neutron-std.git", branch = "main" }
