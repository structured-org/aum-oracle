[package]
authors = []
description = "Time-weighted average exchange rate contract"
edition = "2021"
name = "twaer"
repository = "https://github.com/structured-org/aum-oracle"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { version = "2.2.0" }
cosmwasm-std = { version = "2.2.0" }
cw-storage-plus = "2.0.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "1"
serde_json = "1.0.140"
serde-json-wasm = "0.5.1"
cw-ownable = "2.1.0"
cw2 = "2.0.0"
twaer-common = { path = "../../packages/twaer-common" }
aum-receiver-common = { path = "../../packages/aum-receiver-common" }
ed25519-zebra = { version = "=4.0.3", default-features = false }
