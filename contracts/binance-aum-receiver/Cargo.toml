[package]
authors = []
description = "Binance AUM receiver contract"
edition = "2021"
name = "binance-aum-receiver"
repository = "https://github.com/structured-org/aum-oracle"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { version = "2.2.0" }
cosmwasm-std = { version = "2.2.0" }
cw-storage-plus = "2.0.0"
serde = { version = "1.0.219", features = ["derive"] }
consensus = { path = "../../packages/consensus" }
neutron-std = { git = "https://github.com/neutron-org/neutron-std", branch = "main" }
thiserror = "1"
serde_json = "1.0.140"
cw-ownable = "2.1.0"
cw2 = "2.0.0"
