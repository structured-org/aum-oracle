[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = true

[codegen]
anchorify = true

[programs.localnet]
oracle_data_receiver = "6GwFiXmSWfh4eY7eZsAFVfm1p2uZgrrkXNUU8epWK29B"

