[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
incremental = false

[profile.release.build-override]
opt-level = "z"
incremental = false
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
sha2 = { version = "0.10.9" }