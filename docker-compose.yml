version: '3.8'

services:
  aum-messenger:
    build:
      context: .
      dockerfile: Dockerfile.aum_messenger
    container_name: aum-messenger
    volumes:
      - ./config.yaml:/aum_messenger/config.yaml:ro
    command: ["--config", "/aum_messenger/config.yaml"]

  recorder:
    build:
      context: .
      dockerfile: Dockerfile.recorder
    container_name: recorder
    volumes:
      - ./recorder/config.yaml:/root/config.yaml:ro
    command: ["--config", "/root/config.yaml"]
